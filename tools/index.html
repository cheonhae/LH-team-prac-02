<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1조 주간 민원대장 집계 검증</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<h1>1조 주간 민원대장 집계 검증</h1>
<p>[가상 자료] 실습용 가상 표본으로만 씁니다. 실제 민원 자료를 넣지 마세요.</p>

<ul class="menu">
  <li><a href="index.html">시작 페이지</a></li>
  <li><a href="pages/tally.html">집계 페이지</a></li>
  <li><a href="pages/evidence.html">근거 페이지</a></li>
</ul>

<h2>저장된 데이터 요약</h2>
<div id="summary" class="box"></div>

<h2>백업</h2>
<div class="box">
  <p>
    <button type="button" id="btn-export">백업 내보내기</button>
    <label>가져오기: <input type="file" id="file-import" accept=".json,application/json"></label>
    <button type="button" id="btn-clear">비우기</button>
  </p>
  <p id="backup-msg" class="hidden"></p>
</div>

<script src="assets/common.js"></script>
<script>
  // 시작 페이지 전용 — 저장소는 common.js의 loadData로만 읽는다.
  // 요약은 저장된 값만 보여 준다(CSV를 다시 계산하지 않음, design.md 2절).
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function numText(v) {
    return typeof v === "number" ? String(v) : "-";
  }

  function renderSummary() {
    var box = document.getElementById("summary");
    box.innerHTML = "";
    var t = loadData().tally;
    if (t === null || typeof t !== "object") {
      box.appendChild(el("p", "notice", "저장된 데이터가 없습니다. 집계 페이지에서 먼저 붙여 넣으세요."));
      return;
    }
    var excludedCount = Array.isArray(t.excluded) ? t.excluded.length : 0;
    var check = t.check || {};

    var table = el("table");
    var rows = [
      ["집계한 때", t.savedAt ? String(t.savedAt) : "-"],
      ["전체 행", numText(t.totalRows)],
      ["제외 행", String(excludedCount)],
      ["합계 (전체 − 제외)", numText(check.expected)]
    ];
    rows.forEach(function (r) {
      var tr = el("tr");
      tr.appendChild(el("th", "", r[0]));
      tr.appendChild(el("td", r[0] === "집계한 때" ? "" : "num", r[1]));
      table.appendChild(tr);
    });

    var tr = el("tr");
    tr.appendChild(el("th", "", "판정"));
    var td = el("td");
    if (check.match === true) {
      td.appendChild(el("span", "match", "일치"));
    } else if (check.match === false) {
      td.appendChild(el("span", "mismatch", "불일치"));
    } else {
      td.appendChild(el("span", "", "-"));
    }
    td.appendChild(document.createTextNode(
      " (전체 − 제외 " + numText(check.expected) +
      " · 유형별 합계 " + numText(check.typeSum) +
      " · 처리상태별 합계 " + numText(check.statusSum) + ")"));
    td.appendChild(el("span", "review", "담당 검토 후 확정"));
    tr.appendChild(td);
    table.appendChild(tr);

    box.appendChild(table);
  }

  function showMsg(cls, text) {
    var m = document.getElementById("backup-msg");
    m.className = cls;
    m.textContent = text;
  }

  // 백업·가져오기·비우기 — 저장소는 common.js의 exportJson·importJson·clearData로만 바꾼다.
  document.getElementById("btn-export").addEventListener("click", function () {
    exportJson();
    showMsg("notice", "team1_backup.json 파일을 내려받았습니다.");
  });

  document.getElementById("file-import").addEventListener("change", function (ev) {
    var input = ev.target;
    var file = input.files && input.files[0];
    if (!file) return;
    importJson(file).then(function () {
      renderSummary();
      showMsg("notice", "백업 파일을 가져왔습니다: " + file.name);
    }, function (err) {
      showMsg("error", err.message);
    }).then(function () {
      input.value = "";   // 같은 파일을 다시 골라도 동작하게
    });
  });

  document.getElementById("btn-clear").addEventListener("click", function () {
    if (!window.confirm("저장된 데이터를 모두 지웁니다. 계속할까요?")) return;
    clearData();
    renderSummary();
    showMsg("notice", "저장된 데이터를 비웠습니다.");
  });

  renderSummary();
</script>
</body>
</html>
