<h2>저장된 데이터 요약</h2>
<div id="summary" class="box"></div>

<script src="assets/common.js"></script>
<script>
  // 시작 페이지 전용 — 저장소는 common.js의 loadData로만 읽는다.
  (function () {
    var box = document.getElementById("summary");
    var data = loadData();
    if (data.tally === null) {
      box.innerHTML = '<p class="notice">저장된 데이터가 없습니다. 집계 페이지에서 먼저 붙여 넣으세요.</p>';
    }
  })();
</script>
